name: Entrenamiento autónomo
on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: 'Límite absoluto de pasos'
        required: false
        default: '5000'
      patience:
        description: 'Evaluaciones sin mejora antes de detener'
        required: false
        default: '10'
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Pruebas
        run: python test.py
      - name: Investigar Wikipedia
        run: python research.py --max-queries 20
      - name: Entrenar con early stopping
        run: python train.py --auto --max-steps ${{ inputs.max_steps }} --patience ${{ inputs.patience }} --checkpoint-dir checkpoints
      - name: Pruebas finales
        run: python test.py
      - name: Guardar checkpoints y métricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-ai-training-${{ github.run_number }}
          path: |
            checkpoints/
            dataset/research/
            research_queries.txt
          if-no-files-found: warn
